services:
  postgres:
    image: postgres:18
    labels: {dpr.scope: submission-reproduction}
    environment:
      POSTGRES_USER: dpr_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    ports: ["127.0.0.1::5432"]
    networks: [data_plane]
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ${DPR_SECRETS_DIR:?External private reproduction directory required}/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
        bind: {create_host_path: false}
  bao-volume:
    image: postgres:18
    user: "0:0"
    entrypoint: [sh, -ec]
    command: ['chown "$$DPR_REPRO_UID:$$DPR_REPRO_GID" /data; chmod 0700 /data']
    environment:
      DPR_REPRO_UID: ${DPR_REPRO_UID:?Non-root operator UID required}
      DPR_REPRO_GID: ${DPR_REPRO_GID:?Operator GID required}
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    network_mode: none
    volumes: [openbao_data:/data]
  openbao:
    image: openbao/openbao:2.5.5
    labels: {dpr.scope: submission-reproduction}
    user: "${DPR_REPRO_UID:?Operator UID required}:${DPR_REPRO_GID:?Operator GID required}"
    environment: {SKIP_CHOWN: "1", HOME: /tmp}
    depends_on:
      bao-volume: {condition: service_completed_successfully}
    command: [server, -config=/openbao/config/openbao.hcl]
    ports: ["127.0.0.1::8200"]
    networks: [key_plane]
    volumes:
      - openbao_data:/openbao/file
      - type: bind
        source: ../openbao/openbao.hcl
        target: /openbao/config/openbao.hcl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DPR_SECRETS_DIR:?External private reproduction directory required}/tls/ca.crt
        target: /openbao/tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DPR_SECRETS_DIR:?External private reproduction directory required}/tls/server.crt
        target: /openbao/tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DPR_SECRETS_DIR:?External private reproduction directory required}/tls/server.key
        target: /openbao/tls/server.key
        read_only: true
        bind: {create_host_path: false}
volumes:
  postgres_data: {labels: {dpr.scope: submission-reproduction}}
  openbao_data: {labels: {dpr.scope: submission-reproduction}}
networks:
  data_plane: {}
  key_plane: {}
