name: dpr-secure
services:
  protected-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dpr_protected
      POSTGRES_USER: dpr_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    volumes: [protected-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    networks: [protected]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpr_owner -d dpr_protected"]
      interval: 5s
      timeout: 3s
      retries: 20
  baseline-db:
    image: postgres:17-alpine
    profiles: [lab]
    environment:
      POSTGRES_DB: dpr_baseline
      POSTGRES_USER: baseline_owner
      POSTGRES_PASSWORD: ${BASELINE_DB_PASSWORD:?Run scripts/configure.py first}
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    volumes: [baseline-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55433:5432"]
    networks: [baseline]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline_owner -d dpr_baseline"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${APP_DB_PASSWORD}@protected-db:5432/dpr_protected
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      CRYPTO_PROVIDER: ${CRYPTO_PROVIDER:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENBAO_URL: ${OPENBAO_URL:-}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      OPENBAO_KEY: ${OPENBAO_KEY:-dpr-members}
    networks: [protected, frontend]
    depends_on:
      protected-db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    networks: [frontend]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  tools:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    profiles: [tools]
    user: "0:0"
    entrypoint: ["python"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${APP_DB_PASSWORD}@protected-db:5432/dpr_protected
      MIGRATION_DATABASE_URL: postgresql+psycopg://dpr_owner:${POSTGRES_PASSWORD}@protected-db:5432/dpr_protected
      BASELINE_DATABASE_URL: postgresql+psycopg://baseline_owner:${BASELINE_DB_PASSWORD}@baseline-db:5432/dpr_baseline
    volumes:
      - type: bind
        source: ${DATASET_PATH:-../../Task1_Hackathon_DPR_2026/Task1_Hackathon_DPR_2026/anggota_dummy.sql}
        target: /input/anggota_dummy.sql
        read_only: true
      - ./.local:/workspace/.local
    networks: [protected, baseline]
    depends_on:
      protected-db: {condition: service_healthy}
      baseline-db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  protected: {internal: true}
  baseline: {internal: true}
  frontend: {}
volumes:
  protected-data: {}
  baseline-data: {}
