name: dpr-zhafif-local
services:
  postgres:
    image: postgres:18
    container_name: pg-dpr
    labels:
      dpr.owner: service-b-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/lab-private/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint:
      - /bin/bash
      - -ec
      - |
        install -d -m 0700 -o postgres -g postgres /var/lib/postgresql/lab-tls
        install -m 0600 -o postgres -g postgres /run/lab-private/tls/server.key /var/lib/postgresql/lab-tls/server.key
        install -m 0644 -o postgres -g postgres /run/lab-private/tls/server.crt /var/lib/postgresql/lab-tls/server.crt
        install -m 0644 -o postgres -g postgres /run/lab-private/tls/ca.crt /var/lib/postgresql/lab-tls/ca.crt
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/lab-tls/server.crt -c ssl_key_file=/var/lib/postgresql/lab-tls/server.key -c ssl_ca_file=/var/lib/postgresql/lab-tls/ca.crt -c hba_file=/run/lab-hba.conf -c log_statement=none -c log_min_duration_statement=-1 -c log_min_error_statement=panic -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - lab-data:/var/lib/postgresql
      - type: bind
        source: ${DPR_B_LAB_RUNTIME:?External runtime directory required}
        target: /run/lab-private
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./local-lab-hba.conf
        target: /run/lab-hba.conf
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  lab-data:
    labels:
      dpr.owner: service-b-local
