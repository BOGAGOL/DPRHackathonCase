name: dpr-b-probe
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: probe_owner
      POSTGRES_DB: ${DPR_B_PROBE_DATABASE:?Required disposable database}
      POSTGRES_PASSWORD: ${DPR_B_PROBE_ADMIN_PASSWORD:?Required random password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint:
      - /bin/bash
      - -ec
      - |
        install -d -m 0700 -o postgres -g postgres /var/lib/postgresql/probe-tls
        install -m 0600 -o postgres -g postgres /run/probe-tls/server.key /var/lib/postgresql/probe-tls/server.key
        install -m 0644 -o postgres -g postgres /run/probe-tls/server.crt /var/lib/postgresql/probe-tls/server.crt
        install -m 0644 -o postgres -g postgres /run/probe-tls/ca.crt /var/lib/postgresql/probe-tls/ca.crt
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/probe-tls/server.crt -c ssl_key_file=/var/lib/postgresql/probe-tls/server.key -c ssl_ca_file=/var/lib/postgresql/probe-tls/ca.crt -c log_statement=none -c log_min_error_statement=panic -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0
    ports: ["127.0.0.1:0:5432"]
    volumes:
      - probe-data:/var/lib/postgresql
      - type: bind
        source: ${DPR_B_PROBE_TLS:?Required temporary external certificate directory}/server.key
        target: /run/probe-tls/server.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DPR_B_PROBE_TLS:?Required temporary external certificate directory}/server.crt
        target: /run/probe-tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DPR_B_PROBE_TLS:?Required temporary external certificate directory}/ca.crt
        target: /run/probe-tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U probe_owner -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  probe-data: {}
