name: leakproof

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data_net]

  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6}
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
    volumes:
      - openbao_data:/openbao/file
      - ./config/openbao:/openbao/config:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks: [data_net]

  postgres_exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.17.0}
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${EXPORTER_DB_USER}:${EXPORTER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["9187"]
    networks: [data_net, monitor_net]

  node_exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose: ["9100"]
    networks: [monitor_net]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitor_net]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [monitor_net]

networks:
  data_net:
    internal: true
  monitor_net: {}

volumes:
  postgres_data: {}
  openbao_data: {}
  prometheus_data: {}
  grafana_data: {}

