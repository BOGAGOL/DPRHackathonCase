<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Arsitektur sistem pelindungan data pribadi</title>
<desc id="desc">Browser melalui HTTPS ke Next.js dan FastAPI. Backend memakai dprcrypto, PostgreSQL 18 melalui TLS, dan OpenBao Transit. Backup memakai enkripsi streaming; sumber baseline lab dan material recovery mempunyai batas terpisah.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#47627a" stroke-width="1.6" /></marker>
</defs>
<rect width="1400" height="900" fill="#ffffff" />
<text x="50" y="55" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="30" font-weight="700">Pelindungan data ketika database bocor</text>
<text x="50" y="85" font-family="Arial, Helvetica, sans-serif" fill="#52697c" font-size="16">PostgreSQL 18 + OpenBao 2.5.5 · Arsitektur aktif, bukan klaim seluruh VM telah diaudit</text>
<rect x="370" y="120" width="970" height="210" fill="#f4f8fc" stroke="#c9d6e1" stroke-width="1.5" rx="18" />
<text x="395" y="153" font-family="Arial, Helvetica, sans-serif" fill="#52697c" font-size="16">APPLICATION PLANE</text>
<rect x="50" y="175" width="250" height="125" fill="white" stroke="#7596b4" stroke-width="1.6" rx="12" />
<text x="72" y="210" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">Browser</text><text x="72" y="240" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Enam peran · DTO terbatas</text><text x="72" y="266" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Cookie secure / no-store</text>
<rect x="410" y="175" width="280" height="125" fill="white" stroke="#7596b4" stroke-width="1.6" rx="12" />
<text x="432" y="210" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">Next.js / HTTPS frontend</text><text x="432" y="240" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">UI dan proxy same-origin</text><text x="432" y="266" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Tanpa credential DB/Bao</text>
<rect x="800" y="175" width="500" height="125" fill="white" stroke="#7596b4" stroke-width="1.6" rx="12" />
<text x="822" y="210" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">FastAPI + dprcrypto</text><text x="822" y="240" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Auth · scope/field policy · masking · audit</text><text x="822" y="266" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">AEAD/AAD lokal · DEK di memori · cache TTL</text>
<path d="M300 230H410" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="318" y="213" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">HTTPS</text>
<path d="M690 230H800" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="702" y="206" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">HTTPS</text><text x="701" y="254" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">CA verify</text>
<rect x="370" y="395" width="570" height="210" fill="#f4f8fc" stroke="#c9d6e1" stroke-width="1.5" rx="18" />
<text x="395" y="428" font-family="Arial, Helvetica, sans-serif" fill="#52697c" font-size="16">DATA PLANE</text>
<rect x="410" y="448" width="490" height="125" fill="white" stroke="#7596b4" stroke-width="1.6" rx="12" />
<text x="432" y="483" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">PostgreSQL 18</text><text x="432" y="512" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Ciphertext · wrapped DEK · blind index · REF</text><text x="432" y="540" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Role minimum · RLS · analyst_summary count ≥ 5</text>
<path d="M920 300V353H660V448" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" />
<text x="680" y="378" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">TLS verify-full · app_user / analyst_user / auditor_user</text>
<rect x="1000" y="395" width="340" height="210" fill="#effaf6" stroke="#70a58d" stroke-width="1.6" rx="12" />
<text x="1023" y="430" font-family="Arial, Helvetica, sans-serif" fill="#52697c" font-size="16">KEY PLANE</text><text x="1023" y="465" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">OpenBao Transit</text><text x="1023" y="500" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">pii-kek · finance-kek</text><text x="1023" y="528" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">search-hmac · token TTL</text><text x="1023" y="556" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">TLS · manual unseal</text>
<path d="M1170 300V395" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="1187" y="348" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">TLS / svc-app</text><text x="1187" y="372" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">unwrap / HMAC</text>
<rect x="50" y="448" width="250" height="125" fill="#fff8ee" stroke="#b9a17b" stroke-width="1.5" rx="12" />
<text x="72" y="484" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">CLI migrasi</text><text x="72" y="514" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Source hanya baca</text><text x="72" y="542" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Target baru + validasi</text>
<path d="M300 510H410" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="306" y="485" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">TLS</text>
<rect x="410" y="690" width="490" height="120" fill="#fff8ee" stroke="#b9a17b" stroke-width="1.5" rx="12" />
<text x="432" y="727" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">Backup streaming terenkripsi</text><text x="432" y="757" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">pg_dump → AES-GCM · manifest HMAC</text><text x="432" y="785" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Kunci backup terpisah · restore ke DB baru</text>
<path d="M660 573V690" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="679" y="642" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">backup_user · tanpa file dump plaintext</text>
<rect x="1000" y="690" width="340" height="120" fill="#fff8ee" stroke="#b9a17b" stroke-width="1.5" rx="12" />
<text x="1023" y="727" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">Kustodian / operator</text><text x="1023" y="757" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Material recovery privat</text><text x="1023" y="785" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Root bukan identitas runtime</text>
<path d="M1170 690V605" stroke-dasharray="6 5" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="1186" y="647" font-family="Arial, Helvetica, sans-serif" fill="#47627a" font-size="14">Unseal / rotasi</text>
<rect x="50" y="690" width="250" height="120" fill="#fff8ee" stroke="#b9a17b" stroke-width="1.5" rx="12" />
<text x="72" y="727" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="20" font-weight="700">Batas lab</text><text x="72" y="757" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Baseline/source plaintext</text><text x="72" y="785" font-family="Arial, Helvetica, sans-serif" fill="#152c43" font-size="16">Scope terpisah dari target</text>
<path d="M175 690V573" stroke-dasharray="6 5" stroke="#47627a" stroke-width="2" fill="none" marker-end="url(#arrow)" />
<text x="50" y="860" font-family="Arial, Helvetica, sans-serif" fill="#52697c" font-size="16">Batas: REF/pola NULL dan equality tetap terlihat; data + kemampuan decrypt yang dikuasai bersama tidak dijamin rahasia.</text>
</svg>
